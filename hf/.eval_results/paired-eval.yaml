# Results for the benchmarks that are registered on the Hub and that we run as
# the full published set.
#
# Deliberately absent: we run eleven of BFCL v3's categories, not the full
# published set, and multimodal, LiveCodeBench and RULER are not benchmark
# datasets on the Hub. RULER in particular is synthesized in this repository
# rather than reproduced, so its scores compare two checkpoints and nothing
# else. Publishing any of those under a benchmark's name would invite exactly
# the comparison it does not support.
#
# MMMU-Pro is run at its full 1730-item ten-option set and may belong here
# later; it has no entry yet.
#
# Self-reported: a verified badge requires the run to have happened in HF Jobs
# under inspect-ai, which this harness is not. Values are percentages, matching
# the HLE example in the Hub docs and the community-evals workflow.
- dataset:
    id: Idavidrein/gpqa
    task_id: diamond
  value: 88.89
  date: "2026-08-22"
  source:
    url: https://github.com/nicosuter/Qwen3.8-27B-AWQ/blob/2627efdff5efa0aa78ce3642ac0ad46edcd2ac4f/results/2026-08-22-eval-suite-v2-clean/README.md
    name: Paired evaluation against Qwen3.8-27B-FP8, full result set and protocol
    user: nicosuter
  notes: "full 198-item Diamond set, config gpqa_diamond, split train, choices shuffled per item, one pass over the whole set rather than replicates. Thinking enabled at reasoning_effort=xhigh with our own answer extraction rather than the inspect-ai multiple_choice solver. No tools. The same harness scored the FP8 baseline at 89.90 against Qwen's published 89.2. This result is for the weights published here, whose shards hash identical to the scored checkpoint."
