# Results for the benchmarks that are registered on the Hub and that we run as
# the full published set.
#
# Deliberately absent: we run five of BFCL v3's static categories, not the full
# published set, and multimodal, LiveCodeBench, AA-LCR and AA-Omniscience are
# not benchmark datasets on the Hub. Publishing our subset under a benchmark's
# name would invite exactly the comparison it does not support.
#
# MathArena/apex-shortlist ships an eval.yaml but carries no benchmark:official
# tag, so it is not on the allow-list and this result may not aggregate into a
# leaderboard. It is included anyway: it is the least saturated suite we run,
# and it costs nothing if the Hub ignores it.
#
# Self-reported: a verified badge requires the run to have happened in HF Jobs
# under inspect-ai, which this harness is not. Values are percentages, matching
# the HLE example in the Hub docs and the community-evals workflow.
- dataset:
    id: Idavidrein/gpqa
    task_id: diamond
  value: 89.77
  date: "2026-08-16"
  source:
    url: https://github.com/nicosuter/Qwen3.8-27B-AWQ/blob/a98c04ed502c42b2c25b7960d4b773635f42b52e/results/2026-08-16-paired-2/README.md
    name: Paired evaluation against Qwen3.8-27B-FP8, full result set and protocol
    user: nicosuter
  notes: "full 198-item Diamond set, config gpqa_diamond, split train, choices shuffled per item, mean of 4 replicates (matching the benchmark's epochs=4 / pass_at_1). Thinking enabled at reasoning_effort=xhigh with our own answer extraction rather than the inspect-ai multiple_choice solver. No tools. The same harness scored the FP8 baseline at 88.89 (95% CI 87.99-89.79) against Qwen's published 89.2."

