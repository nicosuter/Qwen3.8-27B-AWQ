# Results for the three suites that are registered Hub benchmarks and that we
# run as the full published set. The other suites in this checkpoint's card are
# deliberately absent: BFCL is registered only for v2/v3 and we run v4, and the
# multimodal, LiveCodeBench, AA-LCR and AA-Omniscience sets are not benchmarks
# here. Publishing a subset under a benchmark's name would invite exactly the
# comparison it does not support.
#
